---
contents:
  packages:
    - tzdata
    - ca-certificates-bundle
    - postgresql-client
    - mariadb-client
    - meshcentral@local

entrypoint:
  command: /usr/bin/node /usr/share/meshcentral/meshcentral.js

cmd: --configfile /etc/meshcentral/config.json

work-dir: /usr/share/meshcentral

accounts:
  run-as: 65532
  users:
    - uid: 65532
      username: meshcentral
  groups:
    - gid: 65532
      groupname: meshcentral

environment:
  NODE_ENV: production

paths:
  - path: /etc/meshcentral
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

  - path: /var/lib/meshcentral
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

  - path: /var/lib/meshcentral/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

  - path: /var/lib/meshcentral/files
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

  - path: /var/lib/meshcentral/backups
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

  - path: /var/lib/meshcentral/recordings
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

volumes:
  - /var/lib/meshcentral

annotations:
  org.opencontainers.image.title: meshcentral
  dev.chainguard.package.main: meshcentral
