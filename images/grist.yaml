---
contents:
  packages:
    - tzdata
    - ca-certificates-bundle
    - grist@local

cmd: /usr/bin/node /usr/share/grist/_build/stubs/app/server/server.js

work-dir: /usr/share/grist

accounts:
  run-as: 65532
  users:
    - uid: 65532
      username: grist
  groups:
    - gid: 65532
      groupname: grist

environment:
  NODE_ENV: production
  NODE_OPTIONS: --no-deprecation
  NODE_PATH: /usr/share/grist/_build:/usr/share/grist/_build/stubs
  TYPEORM_DATABASE: /var/lib/grist/grist-home.db
  GRIST_HOST: 0.0.0.0
  GRIST_INST_DIR: /var/lib/grist
  GRIST_DATA_DIR: /var/lib/grist/docs
  GRIST_SESSION_COOKIE: grist_core
  GRIST_SANDBOX_FLAVOR: unsandboxed
  GRIST_PAGE_TITLE_SUFFIX: _blank
  GRIST_HIDE_UI_ELEMENTS: billing,createSite,helpCenter,importFromAirtable,multiAccounts,multiSite,sendToDrive,supportGrist,templates,themes,tutorials
  GRIST_LOG_LEVEL: error
  GRIST_TELEMETRY_LEVEL: off
  GRIST_SINGLE_PORT: true
  GRIST_SERVE_SAME_ORIGIN: true
  GRIST_ALLOW_AUTOMATIC_VERSION_CHECKING: false

paths:
  - path: /var/lib/grist
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

volumes:
  - /var/lib/grist

annotations:
  org.opencontainers.image.title: grist
  dev.chainguard.package.main: grist
