---
name: Update packages from GitHub

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:

  update:
    name: update
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: melu
        id: melu
        run: |
          install -dm777 tmp
          docker run --read-only --rm \
            -e GITHUB_TOKEN='${{ github.token }}' \
            -e GITHUB_OUTPUT='/output' \
            -e GIT_AUTHOR_NAME='github-actions[bot]' \
            -e GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            -e TMPDIR='/tmp' \
            -v "$GITHUB_OUTPUT":/output:rw \
            -v "$PWD"/tmp:/tmp:rw \
            ghcr.io/0x616d/melu@sha256:4e94fe4f90a9e4d3265145ee6bb7b72cc50ba5142b1b6c178afdc9d78aa79d18 \
            -query-github -push -path packages 'https://github.com/${{ github.repository }}'

      - name: dispatch
        id: dispatch
        if: steps.melu.outputs.packages != ''
        run: |
          curl -X POST \
            -H 'Accept: application/vnd.github.v3+json' \
            -H 'Authorization: token ${{ github.token }}' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yaml/dispatches \
            -d '{"ref":"master","inputs":{"packages":"${{ steps.melu.outputs.packages }}"}}'
