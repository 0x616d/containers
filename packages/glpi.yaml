package:
  name: glpi
  version: "11.0.11"
  epoch: 0
  description: GLPI is an IT asset & service management (ITSM) web application
  copyright:
    - license: GPL-3.0
  dependencies:
    runtime:
      - php
      - php-bcmath
      - php-bz2
      - php-cgi
      - php-ctype
      - php-curl
      - php-dom
      - php-exif
      - php-fileinfo
      - php-gd
      - php-iconv
      - php-intl
      - php-ldap
      - php-mysqli
      - php-mysqlnd
      - php-openssl
      - php-phar
      - php-session
      - php-simplexml
      - php-sodium
      - php-tokenizer
      - php-xml
      - php-xmlreader
      - php-xmlwriter
      - php-zip

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/glpi-project/glpi/releases/download/${{package.version}}/glpi-${{package.version}}.tgz
      expected-sha256: b918b1df4900e008cfc02d84bc9c57eae661e7075465f50b301ec5582b134de2
      delete: true
    working-directory: ${{targets.contextdir}}/usr/share/webapps/glpi

  - name: configurations
    runs: |
      install -Dm644 downstream.php ${{targets.contextdir}}/usr/share/webapps/glpi/inc/downstream.php
      install -Dm644 lighttpd.conf ${{targets.contextdir}}/usr/share/doc/glpi/lighttpd.conf
      install -Dm644 php.ini ${{targets.contextdir}}/usr/share/doc/glpi/php.ini

update:
  enabled: true
  github:
    identifier: glpi-project/glpi
