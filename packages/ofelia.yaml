package:
  name: ofelia
  version: "0.3.22"
  epoch: 0
  description: A docker job scheduler (aka. crontab for docker)
  copyright:
    - license: MIT

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/mcuadros/ofelia/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: a59b833ce4ee6bf1f12d99ca4a73a2b4ab1ea8e1dc9862cf2fd1155dcfb3deb8

  - uses: go/build
    environment:
      CGO_ENABLED: 0
    with:
      packages: .
      output: ofelia
      strip: -s -w -buildid=
      ldflags: |
        -X main.version=v${{package.version}}
        -X main.build=$(date -d @"${SOURCE_DATE_EPOCH:-0}" -u '+%Y-%m-%dT%TZ')

update:
  enabled: true
  github:
    identifier: mcuadros/ofelia
    strip-prefix: v

test:
  pipeline:
    - runs: |
        set -o pipefail
        ofelia | grep ${{package.version}}
